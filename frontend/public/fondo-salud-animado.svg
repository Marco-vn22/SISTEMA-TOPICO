<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" preserveAspectRatio="xMidYMid slice">
  <defs>
    <radialGradient id="wash"><stop stop-color="#8fe0cd" stop-opacity=".55"/><stop offset="1" stop-color="#c9f2e6" stop-opacity="0"/></radialGradient>
    <linearGradient id="wave" x2="1" y2="0"><stop stop-color="#80dac4" stop-opacity=".28"/><stop offset="1" stop-color="#32b9a7" stop-opacity=".12"/></linearGradient>
    <g id="cross"><path d="M-9-25H9V-9H25V9H9V25H-9V9H-25V-9H-9Z" fill="none" stroke="#269f91" stroke-width="2.5" stroke-linejoin="round"/></g>
    <g id="heart"><path d="M0 25S-31 7-31-11C-31-28-10-34 0-18 10-34 31-28 31-11 31 7 0 25 0 25Z" fill="#88d9c5"/><path d="M-23-3H-12L-6-13 2 11 10-3H22" fill="none" stroke="#198c7e" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"/></g>
  </defs>
  <style>
    .drift { animation: drift 14s ease-in-out infinite; }
    .other { animation-delay: -7s; animation-duration: 18s; }
    .wave { animation: wave 22s ease-in-out infinite; }
    .pulse { stroke-dasharray: 600; stroke-dashoffset: 600; animation: pulse 8s ease-in-out infinite; }
    .heart { animation: beat 4s ease-in-out infinite; transform-box:fill-box; transform-origin:center; }
    @keyframes drift { 0%,100% { transform:translate(0,0); } 50% { transform:translate(12px,-20px); } }
    @keyframes wave { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-15px); } }
    @keyframes pulse { 0% { stroke-dashoffset:600; opacity:0; } 15% { opacity:.35; } 70%,85% { stroke-dashoffset:0; opacity:.35; } 100% { stroke-dashoffset:0; opacity:0; } }
    @keyframes beat { 0%,35%,65%,100% { transform:scale(1); } 45%,55% { transform:scale(1.06); } }
    @media (prefers-reduced-motion:reduce) { .drift,.wave,.pulse,.heart { animation:none; } .pulse { stroke-dashoffset:0; opacity:.25; } }
  </style>
  <circle cx="130" cy="140" r="410" fill="url(#wash)"/>
  <circle cx="1510" cy="680" r="490" fill="url(#wash)"/>
  <g class="wave"><path d="M0 830Q250 720 480 845T1000 850T1600 790V1000H0Z" fill="url(#wave)"/><path d="M0 900Q360 800 650 910T1200 900T1600 875V1000H0Z" fill="#c8f0e1" opacity=".5"/></g>
  <g class="drift" opacity=".35"><use href="#cross" x="180" y="190"/><use href="#cross" x="1370" y="700"/><circle cx="320" cy="350" r="9" fill="#54bfaa"/><circle cx="1450" cy="300" r="6" fill="#54bfaa"/></g>
  <g class="drift other" opacity=".3"><use href="#cross" x="1400" y="190"/><use href="#cross" x="350" y="760"/><circle cx="1280" cy="420" r="13" fill="none" stroke="#38a995" stroke-width="2"/><circle cx="140" cy="590" r="18" fill="none" stroke="#38a995" stroke-width="2"/></g>
  <g transform="translate(1280 330) scale(1.8)" opacity=".5"><g class="heart"><use href="#heart"/></g></g>
  <g transform="translate(285 460)" opacity=".24"><circle r="56" fill="#fff"/><use href="#cross"/></g>
  <path d="M1060 600H1150L1173 566 1199 641 1228 580 1245 600H1470" fill="none" stroke="#169c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" opacity=".08"/>
  <path class="pulse" d="M1060 600H1150L1173 566 1199 641 1228 580 1245 600H1470" fill="none" stroke="#169c88" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  <g fill="#fff" opacity=".65"><circle cx="108" cy="310" r="5"/><circle cx="1330" cy="100" r="8"/><circle cx="420" cy="150" r="6"/><circle cx="1490" cy="820" r="5"/></g>
</svg>
