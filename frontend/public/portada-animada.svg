<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" role="img" aria-labelledby="title desc">
  <title id="title">Bienestar y atención en el tópico IESTPSS</title>
  <desc id="desc">Un centro de atención rodeado de un corazón, una cruz médica y una línea de pulso con movimiento suave.</desc>
  <style>
    .float { animation: float 5s ease-in-out infinite; }
    .heart { transform-origin: 423px 75px; animation: heartbeat 3s ease-in-out infinite; }
    .cross { animation: float 5s ease-in-out -2s infinite; }
    .pulse { stroke-dasharray: 330; stroke-dashoffset: 330; animation: trace 4s ease-in-out infinite; }
    .halo { transform-origin: 280px 123px; animation: breathe 5s ease-in-out infinite; }
    @keyframes float { 0%,100% { transform:translateY(0); } 50% { transform:translateY(-9px); } }
    @keyframes heartbeat { 0%,35%,70%,100% { transform:scale(1); } 45%,60% { transform:scale(1.09); } }
    @keyframes trace { 0% { stroke-dashoffset:330; opacity:0; } 15% { opacity:1; } 65%,85% { stroke-dashoffset:0; opacity:1; } 100% { stroke-dashoffset:0; opacity:0; } }
    @keyframes breathe { 0%,100% { transform:scale(1); opacity:.65; } 50% { transform:scale(1.04); opacity:1; } }
    @media (prefers-reduced-motion:reduce) { .float,.heart,.cross,.pulse,.halo { animation:none; } .pulse { stroke-dashoffset:0; } }
  </style>
  <ellipse class="halo" cx="280" cy="123" rx="171" ry="111" fill="#d8fff2" opacity=".65"/>
  <ellipse cx="280" cy="224" rx="184" ry="12" fill="#168a7e" opacity=".12"/>
  <g class="float">
    <rect x="177" y="74" width="207" height="146" rx="18" fill="#f6fffc"/>
    <rect x="197" y="58" width="167" height="43" rx="12" fill="#007f80"/>
    <rect x="269" y="66" width="23" height="28" rx="3" fill="#f6fffc"/>
    <rect x="261" y="74" width="39" height="12" rx="3" fill="#f6fffc"/>
    <rect x="202" y="121" width="44" height="36" rx="7" fill="#b7eee1"/>
    <rect x="315" y="121" width="44" height="36" rx="7" fill="#b7eee1"/>
    <path d="M224 122v34m-21-17h42m92-17v34m-21-17h42" stroke="#69c7b4" stroke-width="3"/>
    <path d="M259 220v-40a21 21 0 0 1 42 0v40" fill="#69c7b4"/>
    <path d="M280 175v45" stroke="#f6fffc" stroke-width="3"/>
    <circle cx="288" cy="196" r="3" fill="#007f80"/>
    <path d="M166 221h230" stroke="#007f80" stroke-width="5" stroke-linecap="round"/>
  </g>
  <g class="heart">
    <circle cx="423" cy="75" r="39" fill="#f2fff9"/>
    <path d="M423 96s-25-15-25-29c0-13 17-18 25-6 8-12 25-7 25 6 0 14-25 29-25 29Z" fill="#18ac9d"/>
    <path d="M405 75h10l5-9 6 17 5-8h10" fill="none" stroke="#fff" stroke-width="2.7" stroke-linejoin="round" stroke-linecap="round"/>
  </g>
  <g class="cross">
    <rect x="98" y="73" width="59" height="59" rx="17" fill="#f2fff9" transform="rotate(-9 127 103)"/>
    <path d="M122 87h12v11h11v12h-11v11h-12v-11h-11V98h11Z" fill="#007f80"/>
  </g>
  <path d="M78 185h39l13-19 16 37 15-26 10 8h29" fill="none" stroke="#007f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" opacity=".16"/>
  <path class="pulse" d="M78 185h39l13-19 16 37 15-26 10 8h29" fill="none" stroke="#007f80" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M401 221q-9-43 16-61 14 27-16 61" fill="#158e7e"/>
  <path d="M402 217q3-47 37-44-1 31-37 44" fill="#45b7a0"/>
  <path d="M159 220q-30-13-27-40 25 2 27 40" fill="#45b7a0"/>
  <circle cx="155" cy="43" r="5" fill="#f2fff9"/><circle cx="387" cy="32" r="4" fill="#007f80" opacity=".4"/>
  <path d="M461 140v14m-7-7h14M78 138v10m-5-5h10" stroke="#007f80" stroke-width="3" stroke-linecap="round" opacity=".4"/>
</svg>
